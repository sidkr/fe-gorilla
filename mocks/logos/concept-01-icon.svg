<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fe-Mail Gorilla">
  <title>Fe-Mail Gorilla</title>

  <!-- ===== BOLD FLAT GEOMETRIC GORILLA holding the Fe badge ===== -->

  <!-- Ears -->
  <circle cx="15" cy="17" r="6" fill="#18181B"/>
  <circle cx="49" cy="17" r="6" fill="#18181B"/>

  <!-- Head / brow mass -->
  <path d="M14 22 a18 18 0 0 1 36 0 v6 a18 18 0 0 1 -36 0 Z" fill="#18181B"/>

  <!-- Face plate (lighter muzzle area) -->
  <path d="M22 23 a10 10 0 0 1 20 0 v3 a10 10 0 0 1 -20 0 Z" fill="#56565E"/>

  <!-- Eyes -->
  <circle cx="27" cy="22" r="2.4" fill="#FFFFFF"/>
  <circle cx="37" cy="22" r="2.4" fill="#FFFFFF"/>

  <!-- Nostrils -->
  <circle cx="29.5" cy="28" r="1.3" fill="#18181B"/>
  <circle cx="34.5" cy="28" r="1.3" fill="#18181B"/>

  <!-- Shoulders / body mass -->
  <path d="M9 56 C9 42 18 36 32 36 C46 36 55 42 55 56 Z" fill="#18181B"/>

  <!-- Left arm reaching to hold the tile -->
  <path d="M11 54 C8 45 13 40 20 41 l4 11 Z" fill="#18181B"/>
  <!-- Right arm reaching to hold the tile -->
  <path d="M53 54 C56 45 51 40 44 41 l-4 11 Z" fill="#18181B"/>

  <!-- ===== Fe element badge held in the hands ===== -->
  <rect x="20" y="40" width="24" height="24" rx="6" fill="#FF4E4E"/>
  <text x="32.5" y="60" font-family="Manrope, Inter, system-ui, sans-serif"
        font-weight="800" font-size="17" letter-spacing="-1.2"
        text-anchor="middle" fill="#FFFFFF">Fe</text>
  <text x="23.5" y="49" font-family="Manrope, Inter, system-ui, sans-serif"
        font-weight="800" font-size="6.5" fill="#FFE8E8">26</text>

  <!-- Hands gripping the tile edges -->
  <rect x="16" y="49" width="6" height="9" rx="3" fill="#56565E"/>
  <rect x="42" y="49" width="6" height="9" rx="3" fill="#56565E"/>
</svg>
