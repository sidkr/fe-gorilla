<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fe-Mail Gorilla</title>
  <!-- Badge -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#18181B"/>
  <rect x="7" y="7" width="50" height="50" rx="12" fill="#FF4E4E"/>

  <!-- Gorilla head silhouette (ears) -->
  <circle cx="17" cy="24" r="6" fill="#18181B"/>
  <circle cx="47" cy="24" r="6" fill="#18181B"/>

  <!-- Head / face base -->
  <path d="M16 27 a16 16 0 0 1 32 0 v8 a16 16 0 0 1 -32 0 Z" fill="#18181B"/>

  <!-- Iron helmet dome over the crown -->
  <path d="M17 26 a15 15 0 0 1 30 0 v3 H17 Z" fill="#56565E"/>
  <path d="M17 26 a15 15 0 0 1 30 0 v1 H17 Z" fill="#C53030"/>
  <!-- Helmet ridge -->
  <rect x="30.5" y="13" width="3" height="13" rx="1.5" fill="#FFD93D"/>
  <!-- Rivets on helmet -->
  <circle cx="22" cy="22" r="1.5" fill="#FFE8E8"/>
  <circle cx="42" cy="22" r="1.5" fill="#FFE8E8"/>

  <!-- Faceguard nose bar -->
  <rect x="30.5" y="28" width="3" height="14" rx="1.5" fill="#56565E"/>

  <!-- Brow / faceguard bar -->
  <rect x="20" y="29" width="24" height="3" rx="1.5" fill="#56565E"/>

  <!-- Eyes -->
  <circle cx="26" cy="34" r="2.4" fill="#FFE8E8"/>
  <circle cx="38" cy="34" r="2.4" fill="#FFE8E8"/>

  <!-- Muzzle -->
  <path d="M25 41 a7 5 0 0 0 14 0 v2 a7 6 0 0 1 -14 0 Z" fill="#FFE8E8"/>
  <ellipse cx="32" cy="42" rx="3.5" ry="2" fill="#56565E"/>

  <!-- Envelope held beside the badge (lower-right) -->
  <g>
    <rect x="40" y="42" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
    <path d="M40.5 43 L48 49 L55.5 43" fill="none" stroke="#FF4E4E" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="48" y="52.5" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="5.5" text-anchor="middle" fill="#18181B">Fe</text>
  </g>
</svg>
