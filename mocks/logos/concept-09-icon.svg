<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Fe-Mail Gorilla</title>

  <!-- ===== ARMORED GORILLA GAUNTLET holding an ENVELOPE ===== -->
  <!-- Flat, geometric, badge-like. Forearm + gauntlet rising from lower-left,
       big knuckle plates gripping the envelope. 4 colors: ink, coral, deep, white. -->

  <!-- Forearm armor plate (rises from bottom-left) -->
  <path d="M6 64 L6 44 Q6 36 14 34 L30 30 L36 48 L22 64 Z" fill="#18181B"/>
  <!-- Forearm rivet studs -->
  <circle cx="13" cy="44" r="1.7" fill="#56565E"/>
  <circle cx="13" cy="52" r="1.7" fill="#56565E"/>
  <circle cx="20" cy="58" r="1.7" fill="#56565E"/>

  <!-- Wrist cuff band -->
  <path d="M24 30 L40 26 L44 40 L30 46 Z" fill="#C53030"/>

  <!-- Back of the gauntlet (palm-side plate behind envelope) -->
  <path d="M30 24 L52 19 Q58 18 58 24 L58 40 Q58 46 52 46 L36 46 Z" fill="#18181B"/>

  <!-- ENVELOPE (gripped, tilted slightly) — white body -->
  <g>
    <path d="M26 18 L58 11 L62 33 L30 40 Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- envelope flap (coral) -->
    <path d="M26 18 L44 27 L62 11" fill="none" stroke="#FF4E4E" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="45" y="35.5" transform="rotate(-12 45 35.5)"
          font-family="Manrope, Inter, system-ui, sans-serif"
          font-weight="800" font-size="9" text-anchor="middle" fill="#18181B">Fe</text>
  </g>

  <!-- KNUCKLE PLATES (four big armored knuckles gripping over the envelope's lower edge) -->
  <g fill="#18181B">
    <rect x="28" y="40" width="9" height="11" rx="3" transform="rotate(-12 32.5 45.5)"/>
    <rect x="37" y="38" width="9" height="11" rx="3" transform="rotate(-12 41.5 43.5)"/>
    <rect x="46" y="36" width="9" height="11" rx="3" transform="rotate(-12 50.5 41.5)"/>
  </g>
  <!-- coral knuckle accents -->
  <g fill="#FF4E4E">
    <rect x="31" y="43" width="3.4" height="3.4" rx="1" transform="rotate(-12 32.7 44.7)"/>
    <rect x="40" y="41" width="3.4" height="3.4" rx="1" transform="rotate(-12 41.7 42.7)"/>
    <rect x="49" y="39" width="3.4" height="3.4" rx="1" transform="rotate(-12 50.7 40.7)"/>
  </g>
</svg>
