<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" role="img" aria-label="Fe-Mail Gorilla">
  <title>Fe-Mail Gorilla</title>

  <!-- ============ LEFT ZONE: armored gorilla offering the envelope (x~8-92 / y~6-84) ============ -->
  <g transform="translate(8,6) scale(1.21875)">
    <!-- (64x64 icon scaled into a 78x78 box) -->

    <!-- Shoulder / body mass -->
    <path d="M30 36 C44 33 58 39 58 56 L26 56 C24 46 24 39 30 36 Z" fill="#18181B"/>
    <!-- Chest armor plate -->
    <path d="M38 40 L52 42 L50 56 L36 56 Z" fill="#56565E"/>

    <!-- Ears -->
    <circle cx="33" cy="13" r="5" fill="#18181B"/>
    <circle cx="55" cy="13" r="5" fill="#18181B"/>

    <!-- Head mass (3/4) -->
    <path d="M32 18 a13 12 0 0 1 26 0 v4 a13 13 0 0 1 -26 0 Z" fill="#18181B"/>
    <!-- Armored brow band -->
    <rect x="34" y="13" width="22" height="4.5" rx="2.25" fill="#56565E"/>
    <!-- Face plate -->
    <path d="M38 19 a7 7 0 0 1 14 0 v2 a7 7 0 0 1 -14 0 Z" fill="#56565E"/>
    <!-- Eyes -->
    <circle cx="42.5" cy="18.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="50.5" cy="18.5" r="1.8" fill="#FFFFFF"/>
    <!-- Nostrils -->
    <circle cx="43.5" cy="23.5" r="1" fill="#18181B"/>
    <circle cx="48.5" cy="23.5" r="1" fill="#18181B"/>

    <!-- Reaching armored arm offering forward -->
    <path d="M34 38 C24 38 14 44 11 52 L22 56 C27 48 32 46 38 46 Z" fill="#18181B"/>
    <rect x="14" y="46" width="13" height="9" rx="3" transform="rotate(-24 20.5 50.5)" fill="#56565E"/>

    <!-- Envelope offered forward -->
    <g transform="rotate(-7 16 47)">
      <rect x="5" y="40" width="24" height="16" rx="2.5" fill="#FFE8E8" stroke="#18181B" stroke-width="2"/>
      <path d="M5 41 L17 49 L29 41" fill="none" stroke="#FF4E4E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="17" y="55" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="8" text-anchor="middle" fill="#18181B">Fe</text>
    </g>

    <!-- Hand gripping the envelope edge -->
    <rect x="22" y="48" width="6" height="9" rx="3" fill="#18181B"/>
  </g>

  <!-- ============ RIGHT ZONE: concept-01 wordmark signature (from x~104) ============ -->
  <text x="104" y="52" font-family="Manrope, Inter, system-ui, sans-serif"
        font-weight="800" font-size="28" letter-spacing="-1.6"
        fill="#18181B">Fe-Mail<tspan fill="#56565E"> Gorilla</tspan></text>

  <!-- Industrial baseline rule under the wordmark -->
  <rect x="104" y="61" width="220" height="3" rx="1.5" fill="#18181B"/>
  <!-- Coral notch accent at the left start of the rule -->
  <rect x="104" y="61" width="34" height="3" rx="1.5" fill="#FF4E4E"/>
</svg>
