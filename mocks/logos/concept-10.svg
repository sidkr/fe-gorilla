<svg viewBox="0 0 340 90" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fe-Mail Gorilla</title>

  <!-- ICON: seated armored gorilla, left zone x:8-92 / y:6-84 -->
  <g transform="translate(8,6) scale(1.21875)">
    <!-- ears -->
    <circle cx="20" cy="13" r="4.5" fill="#56565E"/>
    <circle cx="44" cy="13" r="4.5" fill="#56565E"/>
    <!-- head / helm -->
    <path d="M21 9 h22 a5 5 0 0 1 5 5 v9 a16 16 0 0 1 -32 0 v-9 a5 5 0 0 1 5 -5 z" fill="#18181B"/>
    <!-- brow plate -->
    <rect x="18" y="17" width="28" height="4" rx="2" fill="#FF4E4E"/>
    <!-- eyes -->
    <circle cx="26" cy="25" r="2.6" fill="#FFD93D"/>
    <circle cx="38" cy="25" r="2.6" fill="#FFD93D"/>
    <!-- muzzle -->
    <path d="M27 30 h10 a4 4 0 0 1 4 4 a9 9 0 0 1 -18 0 a4 4 0 0 1 4 -4 z" fill="#56565E"/>
    <!-- armored torso -->
    <path d="M14 42 a18 18 0 0 1 36 0 v6 a4 4 0 0 1 -4 4 H18 a4 4 0 0 1 -4 -4 z" fill="#18181B"/>
    <!-- chest plate seams -->
    <rect x="30.5" y="40" width="3" height="14" rx="1.5" fill="#C53030"/>
    <rect x="22" y="42" width="20" height="3" rx="1.5" fill="#56565E"/>
    <!-- left fist on knee -->
    <circle cx="14" cy="50" r="7" fill="#18181B"/>
    <circle cx="14" cy="50" r="2.5" fill="#56565E"/>
    <!-- right arm holding envelope -->
    <circle cx="50" cy="50" r="7" fill="#18181B"/>
    <rect x="40" y="44" width="18" height="13" rx="2" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <path d="M41 46 l8 6 l8 -6" fill="none" stroke="#FF4E4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="49" y="56.4" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="5.5" text-anchor="middle" fill="#18181B">Fe</text>
  </g>

  <!-- WORDMARK: concept-01 signature, from x:104 -->
  <text x="104" y="48" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="-1.6" fill="#18181B">Fe-Mail<tspan fill="#56565E"> Gorilla</tspan></text>

  <!-- baseline rule with coral notch -->
  <rect x="104" y="58" width="218" height="3" rx="1.5" fill="#18181B"/>
  <rect x="104" y="58" width="34" height="3" rx="1.5" fill="#FF4E4E"/>
</svg>
