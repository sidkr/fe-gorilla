<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fe-Mail Gorilla">
  <title>Fe-Mail Gorilla</title>

  <!-- ===== MECHA GORILLA: angular plated armor, holding an envelope ===== -->

  <!-- Ear plates (angular) -->
  <path d="M12 14 L20 12 L20 22 L12 22 Z" fill="#18181B"/>
  <path d="M52 14 L44 12 L44 22 L52 22 Z" fill="#18181B"/>

  <!-- Head crown / brow mass (faceted, 30deg cut sides) -->
  <path d="M16 24 L22 10 L42 10 L48 24 L44 30 L20 30 Z" fill="#18181B"/>
  <!-- Brow highlight plate (45deg facet) -->
  <path d="M20 30 L24 22 L40 22 L44 30 Z" fill="#56565E"/>

  <!-- Eyes: angular visor slits, lemon tech glow -->
  <path d="M23 25 L29 24 L29 28 L23 28 Z" fill="#FFD93D"/>
  <path d="M41 25 L35 24 L35 28 L41 28 Z" fill="#FFD93D"/>

  <!-- Muzzle / jaw plate -->
  <path d="M24 30 L40 30 L37 38 L27 38 Z" fill="#18181B"/>
  <!-- Nostril vents -->
  <path d="M29 33 L31 33 L31 36 L29 36 Z" fill="#56565E"/>
  <path d="M33 33 L35 33 L35 36 L33 36 Z" fill="#56565E"/>

  <!-- Shoulder / chest armor mass (faceted trapezoid) -->
  <path d="M10 56 L14 38 L50 38 L54 56 Z" fill="#18181B"/>
  <!-- Chest center plate facet -->
  <path d="M24 56 L26 40 L38 40 L40 56 Z" fill="#56565E"/>

  <!-- Left arm plate (angular) -->
  <path d="M10 56 L12 42 L20 44 L22 56 Z" fill="#18181B"/>
  <!-- Right arm plate -->
  <path d="M54 56 L52 42 L44 44 L42 56 Z" fill="#18181B"/>

  <!-- Forearm armor bands gripping the envelope -->
  <path d="M15 50 L21 49 L21 56 L16 56 Z" fill="#56565E"/>
  <path d="M49 50 L43 49 L43 56 L48 56 Z" fill="#56565E"/>

  <!-- ===== ENVELOPE held front-and-center ===== -->
  <rect x="22" y="46" width="20" height="14" rx="1.5" fill="#FF4E4E"/>
  <!-- Envelope flap (crisp V) -->
  <path d="M22 47.5 L32 54 L42 47.5 L42 50 L32 56 L22 50 Z" fill="#C53030"/>
  <!-- Lemon tech accent: glow line along flap edge -->
  <path d="M22 46.6 L32 53 L42 46.6" fill="none" stroke="#FFD93D" stroke-width="1.4" stroke-linejoin="miter"/>
  <!-- "Fe" on the envelope body (below the flap) -->
  <text x="32" y="59.4" font-family="Manrope, Inter, system-ui, sans-serif"
        font-weight="800" font-size="6" text-anchor="middle" fill="#FFFFFF">Fe</text>
</svg>
