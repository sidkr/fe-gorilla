<svg viewBox="0 0 340 90" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fe-Mail Gorilla</title>

  <!-- ===== ICON ZONE (x:8-92 / y:6-84) ===== -->
  <!-- Badge -->
  <rect x="11" y="9" width="78" height="78" rx="20" fill="#18181B"/>
  <rect x="15" y="13" width="70" height="70" rx="16" fill="#FF4E4E"/>

  <!-- Ears -->
  <circle cx="29" cy="37" r="8" fill="#18181B"/>
  <circle cx="71" cy="37" r="8" fill="#18181B"/>

  <!-- Head / face base -->
  <path d="M28 41 a22 22 0 0 1 44 0 v11 a22 22 0 0 1 -44 0 Z" fill="#18181B"/>

  <!-- Iron helmet dome -->
  <path d="M29 39 a21 21 0 0 1 42 0 v4 H29 Z" fill="#56565E"/>
  <path d="M29 39 a21 21 0 0 1 42 0 v1.5 H29 Z" fill="#C53030"/>
  <!-- Helmet ridge -->
  <rect x="48" y="20" width="4" height="19" rx="2" fill="#FFD93D"/>
  <!-- Rivets -->
  <circle cx="36" cy="33" r="2" fill="#FFE8E8"/>
  <circle cx="64" cy="33" r="2" fill="#FFE8E8"/>

  <!-- Faceguard nose bar -->
  <rect x="48" y="43" width="4" height="20" rx="2" fill="#56565E"/>
  <!-- Brow bar -->
  <rect x="34" y="44" width="32" height="4" rx="2" fill="#56565E"/>

  <!-- Eyes -->
  <circle cx="42" cy="51" r="3.4" fill="#FFE8E8"/>
  <circle cx="58" cy="51" r="3.4" fill="#FFE8E8"/>

  <!-- Muzzle -->
  <path d="M38 61 a12 8 0 0 0 24 0 v3 a12 9 0 0 1 -24 0 Z" fill="#FFE8E8"/>
  <ellipse cx="50" cy="62" rx="5" ry="2.6" fill="#56565E"/>

  <!-- Envelope set into badge (lower-right) -->
  <g>
    <rect x="60" y="62" width="22" height="16" rx="2.5" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <path d="M61 63.5 L71 71.5 L81 63.5" fill="none" stroke="#FF4E4E" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="71" y="76.5" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="7" text-anchor="middle" fill="#18181B">Fe</text>
  </g>

  <!-- ===== WORDMARK (from x:104) ===== -->
  <text x="104" y="50" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="-1.6" fill="#18181B">Fe-Mail<tspan fill="#56565E"> Gorilla</tspan></text>

  <!-- Baseline rule with coral notch -->
  <rect x="104" y="60" width="222" height="3" rx="1.5" fill="#18181B"/>
  <rect x="104" y="60" width="34" height="3" rx="1.5" fill="#FF4E4E"/>
</svg>
